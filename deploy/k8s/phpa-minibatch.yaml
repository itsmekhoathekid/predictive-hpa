apiVersion: jamiethompson.me/v1alpha1
kind: PredictiveHorizontalPodAutoscaler
metadata:
  name: house-price-api
  namespace: predictive-hpa-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: house-price-api
  minReplicas: 1
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          averageUtilization: 50
          type: Utilization
  models:
    - type: OnlineLinear
      name: house-price-online
      perSyncPeriod: 1
      resetDuration: 10m
      onlineLinear:
        lookAhead: 10000
        updateMode: minibatch
        batchSize: 6
        learningRate: 0.01
        warmupSamples: 6
        checkpointInterval: 1m
        mode: active
  decisionType: maximum
  syncPeriod: 10000
